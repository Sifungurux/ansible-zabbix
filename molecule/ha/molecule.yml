---
driver:
  name: docker
platforms:
  - name: zabbix-server-1
    image: "geerlingguy/docker-debian12-ansible:latest"
    command: "/lib/systemd/systemd"
    cgroupns_mode: host
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
    networks:
      - name: zabbix-ha-test
  - name: zabbix-server-2
    image: "geerlingguy/docker-debian12-ansible:latest"
    command: "/lib/systemd/systemd"
    cgroupns_mode: host
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
    networks:
      - name: zabbix-ha-test
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
verifier:
  name: ansible
