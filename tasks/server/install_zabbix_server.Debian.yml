---
- name: Install locales package
  ansible.builtin.apt:
    name: locales
    state: present
  tags:
    - server.install

- name: Check which locales are already generated
  ansible.builtin.command: locale -a
  register: zabbix_available_locales
  changed_when: false
  tags:
    - server.install

- name: Enable en_US.UTF-8 in locale.gen
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^# ?en_US\.UTF-8 UTF-8'
    line: 'en_US.UTF-8 UTF-8'
  when: "'en_US.utf8' not in zabbix_available_locales.stdout"
  register: zabbix_locale_gen_conf
  tags:
    - server.install

- name: Generate en_US.UTF-8 locale
  ansible.builtin.command: locale-gen
  when: zabbix_locale_gen_conf.changed
  notify: restart webservice
  tags:
    - server.install

- name: Install MariaDB for server
  ansible.builtin.include_role:
    name: ansible-mysql
  vars:
    mysql_root_db_pass: "{{ db_pass }}"
    mysql_db:
      - name: "{{ zabbix_db }}"
    mysql_users:
      - name: "{{ zabbix_user }}"
        pass: "{{ zabbix_pass }}"
        priv: "*.*:ALL"
  when: db_backend == "mysql"
  tags:
    - server.install

- name: Set up HAProxy for Patroni primary routing
  ansible.builtin.include_tasks: haproxy.yml
  when:
    - db_backend == "pgsql"
    - zabbix_db_proxy_mode == "haproxy"

- name: Fix any broken package state before install
  ansible.builtin.command: apt-get -f install -y
  changed_when: false
  tags:
    - server.install

- name: Check what is blocking zabbix server install
  ansible.builtin.command: >
    apt-get install --dry-run --no-install-recommends
    zabbix-server-{{ db_backend }}
    zabbix-frontend-php
    zabbix-apache-conf
    zabbix-sql-scripts
  register: apt_dry_run
  changed_when: false
  failed_when: false
  tags:
    - server.install

- name: Show apt dry-run output
  ansible.builtin.debug:
    msg: "{{ apt_dry_run.stdout_lines + apt_dry_run.stderr_lines }}"
  tags:
    - server.install

- name: Install zabbix server packages
  ansible.builtin.apt:
    name:
      - "zabbix-server-{{ db_backend }}"
      - zabbix-frontend-php
      - zabbix-apache-conf
      - zabbix-sql-scripts
      - "{{ 'php-pgsql' if db_backend == 'pgsql' else 'php-mysql' }}"
    state: present
  notify: restart webservice
  tags:
    - server.install

- name: Check if Zabbix schema is already imported
  ansible.builtin.command: >
    mysql --user={{ zabbix_user }} --password={{ zabbix_pass }}
    --batch --skip-column-names
    --execute="SELECT COUNT(*) FROM information_schema.tables
               WHERE table_schema='{{ zabbix_db }}' AND table_name='dbversion'"
  register: schema_check
  changed_when: false
  failed_when: false
  when: db_backend == "mysql"
  tags:
    - server.install

- name: Import Zabbix server database schema
  ansible.builtin.shell: >
    zcat {{ zabbix_server_schema_path }} |
    mysql --user={{ zabbix_user }} --password={{ zabbix_pass }} {{ zabbix_db }}
  when:
    - db_backend == "mysql"
    - schema_check.stdout | default('0') | trim == '0'
  tags:
    - server.install

- name: Provision PostgreSQL database, user, and schema
  ansible.builtin.include_tasks: postgresql_db.yml
  when: db_backend == "pgsql"

- name: Enable zabbix-server service
  ansible.builtin.service:
    name: "{{ zabbix_service }}"
    enabled: yes
  tags:
    - server.install
