---
galaxy_info:
  role_name: zabbix
  namespace: sifungurux
  author: "Sifungurux"
  description: "Installs and configures Zabbix server, agent, and proxy on RHEL and Debian-based systems"
  license: BSD
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
    - name: Debian
      versions:
        - all
  galaxy_tags:
    - monitoring
    - zabbix
    - mysql
    - mariadb

dependencies:
  - role: ansible-mysql
    when:
      - zabbix_function == "server"
      - db_backend == "mysql"
